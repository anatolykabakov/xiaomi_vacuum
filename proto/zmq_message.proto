syntax = "proto3";

package xiaomi.robot;

option java_package = "com.xiaomi.robotjoy.proto";
option java_multiple_files = true;

import "map.proto";
import "cmd_vel.proto";

message ZmqMessage {
  int64 timestamp = 1;
  string topic = 2;

  oneof payload {
    OccupancyMap occupancy_map = 3;
    CmdVel cmd_vel = 4;
  }
}
